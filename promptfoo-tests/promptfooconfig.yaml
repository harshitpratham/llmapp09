description: llmapp04 prompt tests
prompts:
  - "{{message}}"
providers:
  - id: http
    config:
      url: http://127.0.0.1:8090/api/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{message}}"
      transformResponse: json.reply
tests:
  - description: answers a plain question
    vars:
      message: What is a folder on a computer?
    assert:
      - type: javascript
        value: output.length > 20
  - description: names the model route for a coding question
    vars:
      message: Write a short Python function that adds two numbers.
    assert:
      - type: javascript
        value: output.length > 20
