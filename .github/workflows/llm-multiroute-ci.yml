name: llm-multiroute
on:
  push:
    paths:
      - "llm-multiroute/**"
      - ".github/workflows/llm-multiroute-ci.yml"
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t harshitpratham/llm-multiroute:1.0.0 ./llm-multiroute
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: harshitpratham/llm-multiroute:1.0.0
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Push image
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "harshitpratham" --password-stdin
          docker push harshitpratham/llm-multiroute:1.0.0
